<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>笔记本管理 - 麦麦的绘图笔记本</title>
<link rel="stylesheet" href="/web/style.css">
</head>
<body>
<div class="container">
  <div id="nav"></div>

  <div class="card">
    <div class="row" style="justify-content: space-between; margin-bottom: 8px;">
      <strong>笔记本管理</strong>
      <button class="btn btn-outline btn-sm" onclick="loadNotebooks()">刷新</button>
    </div>
    <div style="font-size:12px;color:#999;margin-bottom:10px;">
      可新建空白笔记本，或删除已有笔记本。删除后该笔记本的笔记数据将不可恢复；default 与临时笔记本不可删除。
    </div>

    <div class="row" style="margin-bottom:14px;gap:8px;">
      <input type="text" id="newNotebookName" placeholder="新笔记本名称（中文/字母/数字/下划线/连字符）" style="flex:1;" onkeydown="if(event.key==='Enter')doCreateNotebook()">
      <button class="btn" onclick="doCreateNotebook()">新建笔记本</button>
    </div>

    <div id="notebookList"></div>
  </div>

  <div class="card">
    <div class="row" style="justify-content: space-between; margin-bottom: 8px;">
      <strong>上传 / 下载笔记本</strong>
    </div>
    <div style="font-size:12px;color:#999;margin-bottom:12px;line-height:1.7;">
      支持 jsonl（仅笔记数据）与 mpj（zip：笔记 + 索引 + 校验码，不含缓存）两种格式。上传 mpj 会校验完整性并抽样检查索引；校验 / 导入均为后台任务，页面刷新不丢进度。
    </div>

    <div class="row" style="margin-bottom:6px;gap:8px;flex-wrap:wrap;">
      <label>下载:</label>
      <select id="exportNotebook" class="notebook-select" onchange="onExportChange()"><option value="default">default</option></select>
      <select id="exportFormat" onchange="onExportChange()">
        <option value="jsonl">jsonl</option>
        <option value="mpj">mpj（zip）</option>
      </select>
      <input type="text" id="exportFilename" placeholder="文件名" style="flex:1;min-width:120px;">
      <button class="btn" onclick="doExport()">下载</button>
    </div>

    <div class="row hidden" id="exportModeRow" style="margin-bottom:6px;gap:8px;flex-wrap:wrap;">
      <label>mpj 导出方式:</label>
      <select id="exportMode" onchange="onExportModeChange()">
        <option value="direct">直接导出（使用当前索引）</option>
        <option value="rebuild">用第三方 embedding 重新生成索引导出</option>
      </select>
    </div>

    <div class="hidden" id="embeddingConfigRow" style="margin-top:8px;padding:10px;background:#f8f9fa;border-radius:8px;">
      <div style="font-size:12px;color:#333;margin-bottom:6px;">第三方 embedding 配置（保存到服务器，下次自动预填）</div>
      <div class="row" style="gap:6px;flex-wrap:wrap;">
        <input type="text" id="embBaseUrl" placeholder="API 地址，如 https://api.example.com/v1" style="flex:2;min-width:180px;">
        <input type="text" id="embApiKey" placeholder="API 密钥" style="flex:1;min-width:120px;">
        <input type="text" id="embModel" placeholder="模型名" style="flex:1;min-width:120px;">
        <input type="number" id="embTimeout" placeholder="超时(秒)" value="60" style="width:90px;">
        <button class="btn btn-outline btn-sm" onclick="saveEmbeddingProfile()">保存配置</button>
      </div>
    </div>

    <div style="border-top:1px solid #eee;margin:12px 0;"></div>

    <div class="row" style="gap:8px;flex-wrap:wrap;margin-bottom:6px;">
      <label>上传:</label>
      <input type="file" id="importFile" accept=".jsonl,.mpj" style="flex:2;min-width:200px;">
      <label>抽样条数:</label>
      <input type="number" id="importSample" value="25" min="1" max="200" style="width:80px;">
      <button class="btn btn-success" onclick="uploadFile()">上传并校验</button>
    </div>
    <div id="fileImportStatus" style="font-size:13px;color:#666;"></div>

    <div class="card hidden" id="importPreviewCard" style="margin-top:10px;">
      <div class="row" style="justify-content: space-between; margin-bottom: 8px;">
        <strong id="importPreviewTitle">导入预览</strong>
        <button class="btn btn-outline btn-sm" id="importPreviewToggleBtn" onclick="toggleImportPreview()">展开</button>
      </div>
      <div id="importPreviewBody" class="hidden"></div>
    </div>
  </div>
</div>

<script src="/web/app.js"></script>
<script>
let previewMeta = null;
let previewEntries = [];
let previewPage = 1;
const PREVIEW_PAGE_SIZE = 20;
let fileStateTimer = null;

function loadNotebooks() {
  const div = document.getElementById('notebookList');
  div.innerHTML = '<p style="color:#999">加载中...</p>';
  api('GET', '/api/status').then(data => {
    const notebooks = data.notebooks || [];
    if (notebooks.length === 0) {
      div.innerHTML = '<p style="color:#999">暂无笔记本</p>';
    } else {
      div.innerHTML = notebooks.map(nb => {
        const statusText = { ok: '索引有效 ✓', stale: '索引失效 ✗', no_index: '未建索引', empty: '空' }[nb.status] || nb.status;
        const deletable = nb.name !== 'default';
        return `<div style="border:1px solid #eee;border-radius:8px;margin:8px 0;padding:10px;">
          <div class="row" style="flex-wrap:wrap;align-items:center;">
            <span style="flex:1;min-width:0;font-weight:600;">${esc(nb.name)}</span>
            <span style="color:#999;font-size:13px;">${nb.count} 条 · ${statusText}</span>
            <button class="btn btn-danger btn-sm" ${deletable ? `onclick="doDeleteNotebook('${esc(nb.name)}', ${nb.count})"` : 'disabled'}>${deletable ? '删除' : '不可删除'}</button>
          </div>
        </div>`;
      }).join('');
    }
    populateSelects(notebooks);
  }).catch(() => { div.innerHTML = '<p style="color:#c62828">加载失败</p>'; });
}

function populateSelects(notebooks) {
  const exp = document.getElementById('exportNotebook');
  const cur = exp.value || 'default';
  exp.innerHTML = notebooks.map(n => `<option value="${esc(n.name)}">${esc(n.name)}</option>`).join('') || '<option value="default">default</option>';
  exp.value = cur;
  const merge = document.getElementById('importMergeTarget');
  merge.innerHTML = '<option value="">（新建笔记本）</option>' + notebooks.map(n => `<option value="${esc(n.name)}">${esc(n.name)}</option>`).join('');
  onExportChange();
}

function onExportChange() {
  const fmt = document.getElementById('exportFormat').value;
  document.getElementById('exportModeRow').classList.toggle('hidden', fmt !== 'mpj');
  if (fmt !== 'mpj') {
    document.getElementById('embeddingConfigRow').classList.add('hidden');
  } else {
    onExportModeChange();
  }
  const name = document.getElementById('exportNotebook').value || 'default';
  document.getElementById('exportFilename').value = `${name}.${fmt}`;
}

function onExportModeChange() {
  document.getElementById('embeddingConfigRow').classList.toggle('hidden', document.getElementById('exportMode').value !== 'rebuild');
}

function loadEmbeddingProfile() {
  api('GET', '/api/embedding_profile').then(data => {
    const p = data.profile || {};
    if (p.base_url) document.getElementById('embBaseUrl').value = p.base_url;
    if (p.model) document.getElementById('embModel').value = p.model;
    if (p.timeout) document.getElementById('embTimeout').value = p.timeout;
  }).catch(() => {});
}

function saveEmbeddingProfile() {
  const body = {
    base_url: document.getElementById('embBaseUrl').value.trim(),
    api_key: document.getElementById('embApiKey').value.trim(),
    model: document.getElementById('embModel').value.trim(),
    timeout: parseInt(document.getElementById('embTimeout').value || '60', 10),
  };
  api('POST', '/api/embedding_profile', body).then(data => {
    if (data.error) { alert(data.error); return; }
    alert('已保存第三方 embedding 配置');
    document.getElementById('embApiKey').value = '';
  }).catch(() => {});
}

function doExport() {
  const notebook = document.getElementById('exportNotebook').value;
  const format = document.getElementById('exportFormat').value;
  const mode = format === 'mpj' ? document.getElementById('exportMode').value : 'direct';
  let filename = document.getElementById('exportFilename').value.trim();
  const params = new URLSearchParams({ notebook: notebook, format: format, mode: mode, filename: filename });
  window.location.href = `/api/export?${params.toString()}`;
}

// ============ 上传与导入预览 ============

function uploadFile() {
  const fileInput = document.getElementById('importFile');
  const file = fileInput.files && fileInput.files[0];
  if (!file) { alert('请先选择文件'); return; }
  const sample = parseInt(document.getElementById('importSample').value || '25', 10);
  const fd = new FormData();
  fd.append('file', file);
  fd.append('sample', String(sample));
  const status = document.getElementById('fileImportStatus');
  status.innerHTML = '上传中...';
  fetch('/api/import/file', { method: 'POST', body: fd, cache: 'no-store' }).then(r => r.json()).then(data => {
    if (data.error) { status.innerHTML = `<span style="color:#c62828">${esc(data.error)}</span>`; return; }
    startFilePolling();
  }).catch(() => { status.innerHTML = '<span style="color:#c62828">上传失败</span>'; });
}

function startFilePolling() {
  if (fileStateTimer) clearInterval(fileStateTimer);
  pollFileState();
  fileStateTimer = setInterval(pollFileState, 2000);
}

function stopFilePolling() {
  if (fileStateTimer) { clearInterval(fileStateTimer); fileStateTimer = null; }
}

function pollFileState() {
  api('GET', '/api/import/file_state').then(data => {
    const status = document.getElementById('fileImportStatus');
    if (data.state === 'validating') {
      status.innerHTML = '<span style="color:#666">正在校验文件...</span>';
    } else if (data.state === 'importing') {
      status.innerHTML = '<span style="color:#666">正在导入...</span>';
    } else if (data.state === 'ready') {
      stopFilePolling();
      previewMeta = data.preview || {};
      status.innerHTML = '<span style="color:#2e7d32">校验完成，请查看下方预览。</span>';
      renderImportPreview();
    } else if (data.state === 'done') {
      stopFilePolling();
      status.innerHTML = `<span style="color:#2e7d32">${esc((data.result && data.result.message) || '导入完成')}</span>`;
      showResult(data.result || {});
      loadNotebooks();
      loadStatus();
    } else if (data.state === 'error') {
      stopFilePolling();
      const msg = (data.result && data.result.error) || '校验或导入失败';
      status.innerHTML = `<span style="color:#c62828">${esc(msg)}</span>`;
      showResult(data.result || { error: msg });
    } else {
      // none
      stopFilePolling();
    }
  }).catch(() => {});
}

function toggleImportPreview() {
  const body = document.getElementById('importPreviewBody');
  const btn = document.getElementById('importPreviewToggleBtn');
  const hidden = body.classList.toggle('hidden');
  btn.textContent = hidden ? '展开' : '收起';
}

function renderImportPreview() {
  const meta = previewMeta;
  if (!meta) return;
  document.getElementById('importPreviewCard').classList.remove('hidden');
  const body = document.getElementById('importPreviewBody');
  const btn = document.getElementById('importPreviewToggleBtn');
  body.classList.add('hidden');
  btn.textContent = '展开';

  const isMpj = meta.format === 'mpj';
  const tampered = isMpj && meta.checksum_status !== 'ok';
  const dimOk = meta.dim_match !== false;
  const countOk = meta.count_match !== false;

  let html = '<div style="font-size:13px;line-height:1.8;color:#333;">';
  html += `<div><strong>格式：</strong>${isMpj ? 'mpj' : 'jsonl'}　<strong>有效条目：</strong>${meta.valid_count}　<strong>跳过：</strong>${meta.skipped_count || 0}</div>`;
  if (isMpj) {
    html += `<div><strong>校验码：</strong>${tampered ? '<span style="color:#c62828">不一致或缺失（可能被第三方修改）</span>' : '<span style="color:#2e7d32">一致 ✓</span>'}</div>`;
    html += `<div><strong>向量维度：</strong>${meta.dim}　<strong>与内置 embedding 一致：</strong>${dimOk ? '是' : '否'}</div>`;
    html += `<div><strong>条目数 = 向量数：</strong>${countOk ? '是' : '否'}</div>`;
    if (meta.sample && meta.sample.n > 0) {
      html += `<div><strong>抽样相似度（n=${meta.sample.n}）：</strong>平均 ${meta.sample.avg}　最小 ${meta.sample.min}</div>`;
    }
  }
  html += '</div>';

  if (tampered) {
    html += `<div style="margin:10px 0;padding:10px 12px;background:#fdecea;border:1px solid #f5c6c6;border-radius:8px;font-size:13px;color:#b71c1c;line-height:1.7;">
      该文件可能被第三方修改过，从数据完整性角度<b>极其不建议导入</b>。
      <label style="display:block;margin-top:6px;"><input type="checkbox" id="tamperAck" onchange="updateCommitEnable()"> 我已了解风险，仍然继续导入</label>
    </div>`;
  }
  if (isMpj && (!dimOk || !countOk)) {
    html += `<div style="margin:6px 0;padding:8px 10px;background:#fff8e1;border-radius:8px;font-size:13px;color:#795548;">
      向量维度不一致或条目数与向量数不匹配，无法直接导入，将自动使用<b>重建索引导入</b>（用内置 embedding 重建）。
    </div>`;
  }

  html += `<div class="row" style="margin:10px 0;gap:8px;flex-wrap:wrap;">
    <select id="importTargetType" onchange="onTargetTypeChange()">
      <option value="new">新建笔记本</option>
      <option value="merge">合并到已有笔记本</option>
    </select>
    <input type="text" id="importNewName" placeholder="新笔记本名称" style="flex:1;min-width:140px;">
    <select id="importMergeTarget" class="hidden" style="flex:1;min-width:140px;"></select>
  </div>
  <div id="mergeHint" class="hidden" style="font-size:12px;color:#c62828;margin-bottom:6px;">合并后建议到「去重」页扫描一次去重检测。</div>`;

  if (isMpj && dimOk && countOk) {
    html += `<div class="row" style="margin-bottom:8px;gap:8px;">
      <label>导入方式:</label>
      <select id="importMode">
        <option value="direct">直接导入（使用 mpj 自带索引）</option>
        <option value="rebuild">重建索引导入（用内置 embedding 重建）</option>
      </select>
    </div>`;
  }

  html += `<button class="btn btn-success" id="commitBtn" onclick="doCommit()">确认导入</button>
  <div id="previewEntries" style="margin-top:12px;"></div>`;
  body.innerHTML = html;

  onTargetTypeChange();
  loadPreviewPage(1);
  updateCommitEnable();
}

function onTargetTypeChange() {
  const t = document.getElementById('importTargetType').value;
  document.getElementById('importNewName').classList.toggle('hidden', t === 'merge');
  document.getElementById('importMergeTarget').classList.toggle('hidden', t === 'new');
  document.getElementById('mergeHint').classList.toggle('hidden', t !== 'merge');
  updateCommitEnable();
}

function updateCommitEnable() {
  const btn = document.getElementById('commitBtn');
  if (!btn) return;
  const tamperAck = document.getElementById('tamperAck');
  const tampered = previewMeta && previewMeta.format === 'mpj' && previewMeta.checksum_status !== 'ok';
  btn.disabled = tampered && !(tamperAck && tamperAck.checked);
}

function loadPreviewPage(page) {
  api('GET', `/api/import/file_preview?page=${page}&size=${PREVIEW_PAGE_SIZE}`).then(data => {
    if (data.error) { document.getElementById('previewEntries').innerHTML = `<span style="color:#c62828">${esc(data.error)}</span>`; return; }
    previewPage = page;
    const div = document.getElementById('previewEntries');
    if (!data.entries || data.entries.length === 0) {
      div.innerHTML = '<p style="color:#999">暂无条目</p>';
      return;
    }
    div.innerHTML = `<table><thead><tr><th>英文</th><th>中文</th><th>备注</th><th>ID</th></tr></thead><tbody>` +
      data.entries.map(e => `<tr><td>${esc(e.en)}</td><td>${esc(e.zh)}</td><td>${esc(e.note||'')}</td><td class="id">${esc(e.id)}</td></tr>`).join('') +
      `</tbody></table>
      <div class="pagination" style="margin-top:8px;">
        <button class="btn btn-outline btn-sm" ${page>1?'':'disabled'} onclick="loadPreviewPage(${page-1})">上一页</button>
        <span style="font-size:12px;color:#666;margin:0 8px;">第 ${page}/${data.pages||1} 页 · 共 ${data.total} 条</span>
        <button class="btn btn-outline btn-sm" ${page<(data.pages||1)?'':'disabled'} onclick="loadPreviewPage(${page+1})">下一页</button>
      </div>`;
  }).catch(() => {});
}

function doCommit() {
  const meta = previewMeta;
  if (!meta) return;
  const t = document.getElementById('importTargetType').value;
  const body = { mode: 'rebuild', target_name: '', merge_target: '' };
  if (t === 'merge') {
    body.merge_target = document.getElementById('importMergeTarget').value;
    if (!body.merge_target) { alert('请选择合并目标'); return; }
  } else {
    body.target_name = document.getElementById('importNewName').value.trim();
    if (!body.target_name) { alert('请输入新笔记本名称'); return; }
  }
  if (meta.format === 'mpj' && meta.dim_match !== false && meta.count_match !== false) {
    const modeEl = document.getElementById('importMode');
    body.mode = modeEl ? modeEl.value : 'rebuild';
  }
  api('POST', '/api/import/file_commit', body).then(data => {
    if (data.error) { alert(data.error); return; }
    document.getElementById('fileImportStatus').innerHTML = '<span style="color:#666">正在导入...</span>';
    startFilePolling();
  }).catch(() => {});
}

function showResult(result) {
  const status = document.getElementById('fileImportStatus');
  status.innerHTML = result.error
    ? `<span style="color:#c62828">${esc(result.error)}</span>`
    : `<span style="color:#2e7d32">${esc(result.message || '完成')}</span>`;
}

injectNav('notebooks');
loadEmbeddingProfile();
loadNotebooks();
loadStatus();
// 抗刷新：页面加载时检查是否有进行中的导入/可预览的校验
pollFileState();
</script>
</body>
</html>
